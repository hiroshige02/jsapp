name: Deploy front

on:
  push:
    branches:
      - main # mainブランチにマージされた時 or mainブランチにプッシュされた時
  workflow_dispatch:
env:
  ROLE_ARN: arn:aws:iam::${{ secrets.AWS_ID }}:role/${{ secrets.ROLE_NAME }}
  SESSION_NAME: gh-oidc-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  front:
    name: front CD
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDCトークンの取得を許可
      contents: read
    defaults:
      run:
        working-directory: ./front

    steps:
      - name: OpenID Connect
        uses: aws-actions/configure-aws-credentials@v4 # AWSの認証アクション
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: ${{ env.SESSION_NAME }}
          aws-region: ap-northeast-1
      # - run: aws iam list-users # 一時クレデンシャル利用(接続確認用)
      # - run: aws iam create-user --user-name invalid || true # (権限による失敗パターン確認用)

      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Create Env
        env:
          FRONT_ENV: ${{ vars.FRONT_ENV }}
        run: echo "${FRONT_ENV}" > .env
      - name: Install Dependencies
        run: npm ci
      - name: Build front
        run: npm run build
      - name: Deploy to S3
        run: aws s3 sync ./dist s3://www.jsapp.xyz/
